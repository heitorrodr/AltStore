name: Build IPA (unsigned) - AltStore

on:
  push:
    branches:
      - marketplace
  pull_request:
    branches:
      - marketplace

jobs:
  build-ipa:
    runs-on: macos-15

    env:
      SCHEME: AltStore
      CONFIGURATION: Release

    steps:
      - name: Checkout (submodules + LFS)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0

      - name: Ensure submodules are initialized
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Select latest Xcode installed on runner
        run: |
          set -euo pipefail
          echo "Available Xcodes:"
          ls -la /Applications | grep -i xcode || true
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -n 1)
          if [ -z "${XCODE_APP:-}" ]; then
            echo "No Xcode*.app found in /Applications"
            exit 1
          fi
          echo "Using: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcode-select -p

      - name: Detect workspace or project
        run: |
          set -euo pipefail
          if ls -A | grep -qi ".xcworkspace$"; then
            echo workspace > filetype
            ls -A | grep -i ".xcworkspace$" | head -n 1 > file
          else
            echo project > filetype
            ls -A | grep -i ".xcodeproj$" | head -n 1 > file
          fi
          echo "Filetype: $(cat filetype)"
          echo "File: $(cat file)"
          echo "Scheme: $SCHEME"

      - name: Create AppIcon if missing (CI workaround)
        run: |
          set -euo pipefail

          # Locate an xcassets directory (prefer AltStore Resources if present)
          ASSETS=$(find . -maxdepth 6 -type d -name "*.xcassets" | grep "AltStore/Resources" | head -n 1 || true)
          if [ -z "${ASSETS:-}" ]; then
            ASSETS=$(find . -maxdepth 6 -type d -name "*.xcassets" | head -n 1 || true)
          fi

          if [ -z "${ASSETS:-}" ]; then
            echo "No .xcassets found"
            exit 1
          fi

          echo "Using asset catalog: $ASSETS"

          ICONSET="$ASSETS/AppIcon.appiconset"
          if [ -d "$ICONSET" ]; then
            echo "AppIcon already exists, skipping."
            exit 0
          fi

          mkdir -p "$ICONSET"

          FALLBACK="/System/Library/CoreServices/CoreTypes.bundle/Contents/Resources/GenericApplicationIcon.icns"
          if [ -f "$FALLBACK" ]; then
            sips -s format png "$FALLBACK" --out "$ICONSET/icon-1024.png" >/dev/null
            sips -z 1024 1024 "$ICONSET/icon-1024.png" >/dev/null
          else
            echo "Fallback icon not found, cannot generate icon."
            exit 1
          fi

          cat > "$ICONSET/Contents.json" << 'JSON'
          {
            "images": [
              {
                "idiom": "ios-marketing",
                "size": "1024x1024",
                "scale": "1x",
                "filename": "icon-1024.png"
              }
            ],
            "info": { "author": "xcode", "version": 1 }
          }
          JSON

          echo "Created AppIcon at: $ICONSET"
          ls -la "$ICONSET"

      - name: Build for iPhoneOS (no signing)
        run: |
          set -euo pipefail
          FILETYPE=$(cat filetype)
          FILE=$(cat file)

          # If xcpretty is not available, fall back to raw xcodebuild output
          if command -v xcpretty >/dev/null 2>&1; then
            xcodebuild clean build \
              -"$FILETYPE" "$FILE" \
              -scheme "$SCHEME" \
              -configuration "$CONFIGURATION" \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              | xcpretty
          else
            xcodebuild clean build \
              -"$FILETYPE" "$FILE" \
              -scheme "$SCHEME" \
              -configuration "$CONFIGURATION" \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH=$(find build/Build/Products -type d -name "*.app" | grep "/${CONFIGURATION}-iphoneos/" | head -n 1 || true)
          if [ -z "${APP_PATH:-}" ]; then
            echo "Could not find built .app"
            find build/Build/Products -maxdepth 4 -type d -name "*.app" -print || true
            exit 1
          fi

          rm -rf Payload dist
          mkdir -p Payload dist
          cp -R "$APP_PATH" Payload/

          IPA_NAME="${SCHEME}-unsigned.ipa"
          /usr/bin/zip -r "dist/$IPA_NAME" Payload >/dev/null

          echo "Created dist/$IPA_NAME"
          ls -la dist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AltStore-ipa
          path: dist/*.ipa
