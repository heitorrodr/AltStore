name: Xcode - Build and Analyze

on:
  push:
    branches: [ "marketplace" ]
  pull_request:
    branches: [ "marketplace" ]

jobs:
  build:
    name: Build and analyse default scheme using xcodebuild command
    runs-on: macos-latest

    steps:
      - name: Checkout (with submodules + LFS)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0

      - name: Ensure submodules are initialized
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Verify OpenSSL.xcframework exists (debug)
        run: |
          ls -la AltStore/Dependencies/AltSign/Dependencies/OpenSSL/Frameworks || true
          ls -la Dependencies/AltSign/Dependencies/OpenSSL/Frameworks || true
          find . -maxdepth 6 -type d -name "OpenSSL.xcframework" -print || true

      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo "$scheme_list" | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo "$default" > default
          echo "Using default scheme: $default"

      - name: Build
        env:
          scheme: default
        run: |
          set -eo pipefail

          if [ "$scheme" = "default" ]; then
            scheme=$(cat default)
          fi

          if ls -A | grep -qiE '\.xcworkspace$'; then
            filetype_parameter="workspace"
            file_to_build="$(ls -A | grep -iE '\.xcworkspace$' | head -n 1)"
          else
            filetype_parameter="project"
            file_to_build="$(ls -A | grep -iE '\.xcodeproj$' | head -n 1)"
          fi

          file_to_build="$(echo "$file_to_build" | awk '{$1=$1;print}')"

          echo "Building scheme: $scheme"
          echo "Building $filetype_parameter: $file_to_build"

          xcodebuild clean build analyze \
            -scheme "$scheme" \
            -"$filetype_parameter" "$file_to_build" \
            | xcpretty
