name: Build IPA (unsigned) - AltStore

on:
  push:
    branches: [ "marketplace" ]
  pull_request:
    branches: [ "marketplace" ]

jobs:
  build-ipa:
    runs-on: macos-latest

    env:
      SCHEME: AltStore
      CONFIGURATION: Release

    steps:
      - name: Checkout (submodules + LFS)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0

      - name: Ensure submodules are initialized
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Detect workspace/project
        shell: bash
        run: |
          set -euo pipefail
          if ls -A | grep -qiE '\.xcworkspace$'; then
            echo "workspace" > filetype
            ls -A | grep -iE '\.xcworkspace$' | head -n 1 > file
          else
            echo "project" > filetype
            ls -A | grep -iE '\.xcodeproj$' | head -n 1 > file
          fi
          echo "Filetype: $(cat filetype)"
          echo "File: $(cat file)"
          echo "Scheme forced: $SCHEME"

      - name: List schemes (debug)
        shell: bash
        run: |
          set -euo pipefail
          FILETYPE=$(cat filetype)
          FILE=$(cat file)
          xcodebuild -list -"$FILETYPE" "$FILE"

      - name: Build for iPhoneOS (no signing)
        shell: bash
        run: |
          set -euo pipefail

          FILETYPE=$(cat filetype)
          FILE=$(cat file)

          xcodebuild clean build \
            -"$FILETYPE" "$FILE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find build/Build/Products -type d -name '*.app' \
            | grep -E "/${CONFIGURATION}-iphoneos/.*\.app$" \
            | head -n 1 || true)"

          if [ -z "$APP_PATH" ]; then
            echo "❌ Could not find built .app in build/Build/Products/${CONFIGURATION}-iphoneos"
            find build/Build/Products -maxdepth 4 -type d -name "*.app" -print || true
            exit 1
          fi

          echo "✅ APP_PATH=$APP_PATH"

          rm -rf Payload dist
          mkdir -p Payload dist
          cp -R "$APP_PATH" Payload/

          IPA_NAME="${SCHEME}-unsigned.ipa"
          /usr/bin/zip -r "dist/$IPA_NAME" Payload >/dev/null

          echo "✅ Created dist/$IPA_NAME"
          ls -la dist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AltStore-ipa
          path: dist/*.ipa
